% IWR6843 raw ADC/LVDS configuration for micro-Doppler feature extraction
% One physical transmitter (TX0) and one physical receiver (RX0)
% ADC samples/chirp: 128 complex samples at 4 Msps (32 us sampling window)
% Sampled RF bandwidth: 31.25 MHz/us * 32 us = 1 GHz
% Chirp period: 270 us idle + 40 us ramp = 310 us
% Chirp rate: 3225.806 Hz (approximately 3.2 kHz)
% Chirps/frame: 1 chirp * 128 loops = 128
% Frame period: 40 ms (25 FPS); active chirp time is 39.68 ms
% Inter-frame idle time: 0.32 ms (meets the 0.3 ms raw-capture minimum)

flushCfg
dfeDataOutputMode 1
channelCfg 1 1 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
profileCfg 0 60 270 6 40 0 0 31.25 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
frameCfg 0 0 128 0 40 1 0
lowPower 0 0
lvdsStreamCfg -1 0 1 0
testSrcCfg 0 0
sensorStart
